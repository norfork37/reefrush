<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reef Rush</title>
  <style>
    :root { color-scheme: light dark; --bg:#0b3d4a; --card:#0f5160; --text:#e8fbff; --muted:#a9d5de; --accent:#7dffc8; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; background:linear-gradient(160deg,#06262f,#0b3d4a 40%,#125a4a); color:var(--text); min-height:100vh; }
    main { max-width:640px; margin:0 auto; padding:48px 20px; }
    .card { background:rgba(15,81,96,.85); border:1px solid rgba(125,255,200,.25); border-radius:16px; padding:28px; box-shadow:0 12px 40px rgba(0,0,0,.25); }
    h1 { margin:0 0 8px; font-size:1.8rem; }
    p { color:var(--muted); line-height:1.55; }
    a.btn { display:inline-block; margin:8px 10px 0 0; padding:12px 16px; border-radius:999px; background:var(--accent); color:#04352a; text-decoration:none; font-weight:700; }
    a.link { color:var(--accent); }
    footer { margin-top:28px; font-size:.9rem; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Reef Rush</h1>
      <p>Ocean survival for iPhone and iPad. Eat, grow, and team up with a nearby friend.</p>
      <p>
        <a class="btn" href="privacy.html">Privacy Policy</a>
        <a class="btn" href="support.html">Support</a>
      </p>
      <footer>Contact: <a class="link" href="mailto:norfork37@gmail.com">norfork37@gmail.com</a></footer>
    </div>
  </main>
</body>
</html>
